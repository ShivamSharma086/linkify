<!DOCTYPE html>
<html>
<head>

    <meta charset="UTF-8">
    <title>Linkify Login</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Fonts + Bootstrap -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            margin: 0;
            font-family: 'Poppins', sans-serif;

            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;

            background: linear-gradient(-45deg, #667eea, #764ba2, #6a11cb, #2575fc);
            background-size: 400% 400%;
            animation: gradientBG 10s ease infinite;
        }

        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .card {
            width: 90%;
            max-width: 400px;
            padding: 30px;
            border-radius: 20px;
            text-align: center;
            position: relative;

            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(15px);
            border: 1px solid rgba(255,255,255,0.2);

            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            transition: 0.3s;
        }

        .card:hover {
            transform: translateY(-5px);
        }

        input {
            margin-bottom: 10px;
        }

        .password-box {
            position: relative;
        }

        .toggle {
            position: absolute;
            right: 12px;
            top: 10px;
            cursor: pointer;
        }

        .btn-custom {
            background: linear-gradient(45deg, #6a11cb, #2575fc);
            border: none;
            color: white;
        }

        /* ✅ Register button ALWAYS GREEN */
        .register-btn,
        .register-btn:hover,
        .register-btn:focus,
        .register-btn:active {
            background: #10b981 !important;
            color: white !important;
            border: none !important;
        }

        /* Smooth hover animation (NO SCALE ISSUE) */
        .btn-custom,
        .register-btn {
            transition: all 0.2s ease;
        }

        .btn-custom:hover,
        .register-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 15px rgba(0,0,0,0.3);
        }

        .btn-custom:active,
        .register-btn:active {
            transform: translateY(0);
            box-shadow: none;
        }

        .toggle-mode {
            position: absolute;
            top: 15px;
            right: 20px;
            cursor: pointer;
            font-size: 18px;
            color: white;
        }

        .error {
            color: #ff6b6b;
            font-size: 13px;
            display: none;
        }

        .loader {
            display: none;
            color: white;
            position: absolute;
            bottom: -30px;
            left: 50%;
            transform: translateX(-50%);
        }

        /* Dark Mode */
        .dark-mode {
            background: #0f172a !important;
        }

        .dark-mode .card {
            background: rgba(30,41,59,0.7);
            color: white;
        }

        .dark-mode input {
            background: rgba(255,255,255,0.1);
            color: white;
            border: none;
        }

        @media (max-width: 576px) {
            body {
                padding: 15px;
                align-items: flex-start;
            }

            .card {
                margin-top: 40px;
                padding: 20px;
            }
        }
    </style>
</head>

<body>

<div class="card shadow-lg">

    <div class="toggle-mode" onclick="toggleMode()">🌙</div>

    <h2>🔗 Linkify</h2>
    <p style="color:white;">Login / Register</p>

    <input id="user" class="form-control" placeholder="Username">

    <div class="password-box">
        <input id="pass" type="password" class="form-control" placeholder="Password">
        <span class="toggle" onclick="togglePassword()">👁️</span>
    </div>

    <div class="error" id="error"></div>

    <!-- SAME FUNCTION -->
    <button class="btn btn-custom w-100 mt-2" onclick="handleAuth('login')">Login</button>
    <button class="btn register-btn w-100 mt-2" onclick="handleAuth('register')">Register</button>

    <div class="loader" id="loader">⏳ Processing...</div>

</div>

<script>

    function toggleMode() {
        document.body.classList.toggle("dark-mode");
    }

    function togglePassword() {
        let pass = document.getElementById("pass");
        pass.type = pass.type === "password" ? "text" : "password";
    }

    function showLoader(show) {
        document.getElementById("loader").style.display = show ? "block" : "none";
    }

    function showError(msg) {
        let error = document.getElementById("error");
        error.innerText = msg;
        error.style.display = "block";
    }

    function handleAuth(type) {
    let user = document.getElementById("user").value.trim();
    let pass = document.getElementById("pass").value.trim();

    if(user === "" || pass === ""){
        showError("Enter username and password");
        return;
    }

    showLoader(true);

    fetch("/auth/" + type, {
        method: "POST",
        headers: {
            "Content-Type": "application/json"
        },
        body: JSON.stringify({
            username: user,
            password: pass
        })
    })
    .then(res => res.json())
    .then(data => {
        showLoader(false);

        if (data.message) {
            localStorage.setItem("user", user);
            window.location.href = "index.html";
        } else {
            showError(data.error);
        }
    })
    .catch(() => {
        showLoader(false);
        showError("Server error");
    });

    }

</script>

</body>
</html>
