```html
<!DOCTYPE html>
<html>
<head>

    <meta charset="UTF-8">
    <title>Linkify Login</title>

    <!-- ✅ Mobile -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Fonts + Bootstrap -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            margin: 0;
            font-family: 'Poppins', sans-serif;

            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;

            background: linear-gradient(-45deg, #667eea, #764ba2, #6a11cb, #2575fc);
            background-size: 400% 400%;
            animation: gradientBG 10s ease infinite;
        }

        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .card {
            width: 90%;
            max-width: 400px;
            padding: 30px;
            border-radius: 20px;
            text-align: center;
            position: relative;

            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(15px);
            border: 1px solid rgba(255,255,255,0.2);

            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            transition: 0.3s;
        }

        .card:hover {
            transform: translateY(-5px);
        }

        input {
            margin-bottom: 10px;
        }

        .password-box {
            position: relative;
        }

        .toggle {
            position: absolute;
            right: 12px;
            top: 10px;
            cursor: pointer;
        }

        .btn-custom {
            background: linear-gradient(45deg, #6a11cb, #2575fc);
            border: none;
            color: white;
        }

        .btn-custom:hover {
            transform: scale(1.05);
        }

        .register-btn {
            background: #10b981;
            color: white;
        }

        .toggle-mode {
            position: absolute;
            top: 15px;
            right: 20px;
            cursor: pointer;
            font-size: 18px;
            color: white;
        }

        .error {
            color: #ff6b6b;
            font-size: 13px;
            display: none;
        }

        .loader {
            display: none;
            margin-top: 10px;
            color: white;
        }

        /* 🌙 Dark Mode */
        .dark-mode {
            background: #0f172a !important;
        }

        .dark-mode .card {
            background: rgba(30,41,59,0.7);
            color: white;
        }

        .dark-mode input {
            background: rgba(255,255,255,0.1);
            color: white;
            border: none;
        }

        /* 📱 Mobile */
        @media (max-width: 576px) {
            body {
                padding: 15px;
                align-items: flex-start;
            }

            .card {
                margin-top: 40px;
                padding: 20px;
            }
        }
    </style>
</head>

<body>

<div class="card shadow-lg">

    <div class="toggle-mode" onclick="toggleMode()">🌙</div>

    <h2>🔗 Linkify</h2>
    <p style="color:white;">Login to continue</p>

    <input id="user" class="form-control" placeholder="Username">

    <div class="password-box">
        <input id="pass" type="password" class="form-control" placeholder="Password">
        <span class="toggle" onclick="togglePassword()">👁️</span>
    </div>

    <div class="error" id="error">Invalid login</div>

    <button class="btn btn-custom w-100 mt-2" onclick="login()">Login</button>
    <button class="btn register-btn w-100 mt-2" onclick="register()">Register</button>

    <div class="loader" id="loader">⏳ Processing...</div>

</div>

<script>

    window.onload = function () {
        const theme = localStorage.getItem("theme");
        if (theme === "dark") {
            document.body.classList.add("dark-mode");
        }
    }

    function toggleMode() {
        document.body.classList.toggle("dark-mode");
        localStorage.setItem("theme",
            document.body.classList.contains("dark-mode") ? "dark" : "light");
    }

    function togglePassword() {
        let pass = document.getElementById("pass");
        pass.type = pass.type === "password" ? "text" : "password";
    }

    function showLoader(show) {
        document.getElementById("loader").style.display = show ? "block" : "none";
    }

    function showError(msg) {
        let error = document.getElementById("error");
        error.innerText = msg;
        error.style.display = "block";
    }

    function register() {
        let user = document.getElementById("user").value;
        let pass = document.getElementById("pass").value;

        showLoader(true);

        fetch("/auth/register?username=" + user + "&password=" + pass, {
            method: "POST"
        })
        .then(res => res.text())
        .then(data => {
            showLoader(false);
            alert(data);
        });
    }

    function login() {
        let user = document.getElementById("user").value;
        let pass = document.getElementById("pass").value;

        showLoader(true);

        fetch("/auth/login?username=" + user + "&password=" + pass, {
            method: "POST"
        })
        .then(res => res.text())
        .then(data => {
            showLoader(false);

            if (data.includes("successful")) {
                localStorage.setItem("user", user);
                window.location.href = "index.html";
            } else {
                showError("Invalid username or password");
            }
        });
    }

</script>

</body>
</html>
```
