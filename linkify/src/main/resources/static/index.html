<!DOCTYPE html>

<html>
<head>
    <meta charset="UTF-8">
    <title>Linkify</title>

    ```
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Fonts + Bootstrap -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            margin: 0;
            font-family: 'Poppins', sans-serif;

            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;

            background: linear-gradient(-45deg, #667eea, #764ba2, #6a11cb, #2575fc);
            background-size: 400% 400%;
            animation: gradientBG 10s ease infinite;
        }

        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .card {
            width: 90%;
            max-width: 420px;
            padding: 30px;
            border-radius: 20px;
            text-align: center;
            position: relative;

            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(15px);
            border: 1px solid rgba(255,255,255,0.2);

            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            transition: 0.3s;
        }

        .card:hover {
            transform: translateY(-5px);
        }

        .btn-custom {
            background: linear-gradient(45deg, #6a11cb, #2575fc);
            border: none;
            transition: 0.3s;
        }

        .btn-custom:hover {
            transform: scale(1.05);
            box-shadow: 0 5px 15px rgba(0,0,0,0.3);
        }

        input.form-control {
            background: rgba(255, 255, 255, 0.9);
            color: #000;
            border: none;
            border-radius: 10px;
        }

        input.form-control::placeholder {
            color: #555;
        }

        input.form-control:focus {
            outline: none;
            box-shadow: 0 0 0 2px rgba(255,255,255,0.5);
        }

        .toggle-mode {
            position: absolute;
            top: 15px;
            right: 20px;
            cursor: pointer;
            font-size: 18px;
            color: white;
        }

        #result {
            margin-top: 10px;
        }

        #result .alert {
            background: #ffffff;
            color: #000;
            border-radius: 12px;
            padding: 12px;
            text-align: center;
            border: none;
        }

        #result a {
            color: #2563eb;
            font-weight: 500;
            word-break: break-all;
        }

        button.btn-success {
            background: linear-gradient(45deg, #22c55e, #16a34a);
            border: none;
            transition: 0.3s;
        }

        button.btn-success:hover {
            transform: scale(1.03);
            box-shadow: 0 5px 15px rgba(0,0,0,0.3);
        }

        .dark-mode {
            background: #0f172a !important;
        }

        .dark-mode .card {
            background: rgba(30,41,59,0.7);
            color: white;
        }

        .dark-mode input.form-control {
            background: rgba(255,255,255,0.15);
            color: white;

        .dark-mode #result .alert {

    </style>

</head>

<body>

<div class="card shadow-lg">

    ```
    <div class="toggle-mode" onclick="toggleMode()">🌙</div>

    <h2>🔗 Linkify</h2>
    <p>Shorten your long URLs</p>

    <input type="text" id="url" class="form-control mb-3"
           placeholder="Paste URL here">

    <button class="btn btn-custom w-100 text-white" onclick="shorten()">
        Shorten URL
    </button>

    <div class="mt-4">
        <div id="result"></div>
        <button class="btn btn-success mt-2 w-100" onclick="copyLink()">Copy</button>
    </div>
    ```

</div>

<script>

    let latestURL = "";

    function applyTheme() {
        const theme = localStorage.getItem("theme");
        if (theme === "dark") {
            document.body.classList.add("dark-mode");
        } else {
            document.body.classList.remove("dark-mode");
        }
    }

    window.onload = applyTheme;

    function toggleMode() {
        let isDark = document.body.classList.toggle("dark-mode");
        localStorage.setItem("theme", isDark ? "dark" : "light");
    }

    window.addEventListener("storage", function (event) {
        if (event.key === "theme") {
            applyTheme();
        }
    });

    function shorten() {
        let url = document.getElementById("url").value.trim();

        if (!url) {
            alert("Enter URL");
            return;
        }

        document.getElementById("result").innerHTML = "Generating...";

        fetch("https://linkify-3.onrender.com/api/shorten", {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify({ url: url })
        })
        .then(res => res.json())
        .then(data => {

            if (data.error) {
                document.getElementById("result").innerHTML =
                    `<div class="alert">${data.error}</div>`;
                return;
            }

            let clean = data.shortUrl;
            latestURL = clean;

            document.getElementById("result").innerHTML =
                `<div class="alert mt-2">
                    <a href="${clean}" target="_blank">${clean}</a>
                 </div>`;

            document.getElementById("url").value = "";
        })
        .catch(() => {
            alert("Error shortening URL");
        });
    }

    function copyLink() {
        if (!latestURL) {
            alert("No URL found!");
            return;
        }

        navigator.clipboard.writeText(latestURL)
            .then(() => alert("Copied: " + latestURL));
    }

</script>

</body>
</html>
